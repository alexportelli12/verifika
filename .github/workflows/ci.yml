name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
        include:
          - os: ubuntu-latest
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # docs-fresh compares the branch with origin's default branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # After npm ci, which clears node_modules. The key changes with the pinned Vale version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/vale
          key: vale-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/docs/vale.mjs') }}
      # Verifika verifies itself: format, lint, typecheck, build, tests, skill, packaged install.
      - run: npm run verify:ci -- --mode human
      - name: Show failed check logs
        if: failure()
        run: node src/cli.ts logs --failed --tail 200

  # Single status for branch protection, independent of the matrix shape.
  ci-ok:
    name: CI passed
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.verify.result }}" = "success"
