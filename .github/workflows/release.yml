name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # npm's trusted publisher is bound to this environment; add protection rules
    # (such as a required reviewer) to it in the repository settings.
    environment: release
    permissions:
      contents: write # create the GitHub release and upload the package
      id-token: write # npm trusted publishing (OIDC) and provenance; no npm token is stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check the tag is on main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Check the tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check npm supports trusted publishing
        run: |
          if [ "$(printf '%s\n' 11.5.1 "$(npm --version)" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "npm $(npm --version) is too old for trusted publishing (needs 11.5.1+)" >&2
            exit 1
          fi

      # Builds dist/, runs every check and smoke-tests an installed tarball.
      - run: npm run verify -- --mode human

      - name: Pack
        run: npm pack --ignore-scripts

      # Publishes the tarball that was just tested. A rerun (for example after the
      # GitHub release step failed) skips versions already on npm; the registry
      # also refuses to publish a version twice.
      - name: Publish to npm
        run: |
          if [ -n "$(npm view "verifika@$VERSION" version 2>/dev/null)" ]; then
            echo "verifika@$VERSION is already on npm; skipping publish"
          else
            npm publish "verifika-$VERSION.tgz" --provenance --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[?" version "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md" > release-notes.md
          cat >> release-notes.md <<NOTES

          ## Install

          \`\`\`sh
          npm install --save-dev verifika@${VERSION}
          \`\`\`

          Then run \`npx verifika\`, or the shorthand \`npx vfk\`. The package is also attached below.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "verifika-$VERSION.tgz" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "verifika-$VERSION.tgz" \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
