name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release and upload the package

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm run verify -- --mode human

      # The verify gate already built dist/ and smoke-tested an installed tarball.
      - name: Pack
        run: npm pack --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[?" version "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md" > release-notes.md
          cat >> release-notes.md <<NOTES

          ## Install

          \`\`\`sh
          npm install --save-dev https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/verifika-${VERSION}.tgz
          \`\`\`
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "verifika-$VERSION.tgz" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "verifika-$VERSION.tgz" \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
